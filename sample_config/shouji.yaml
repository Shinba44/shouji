# shouji の設定ファイル．C-q Space のメニューに並べるタスクファイルを書く．
# 相対パスは，この shouji.yaml のあるディレクトリから探す．
#
# 書き方:
#   - task.yaml                  # パスだけ（名前はファイル名から．この例なら "task"）
#   - path: ~/work/api/task.yaml # 細かく指定する場合
#     name: api                  #   メニューに出す名前（省略可）
#
# 起動時にタスクを開きたいときは，shouji -t task.yaml のように指定する．
#
# env と pre_command を書くと，ここに並べたすべてのタスクに付く（タスク側の値が優先）．
# shouji -t で開いたタスクにも，そのタスクファイルと同じディレクトリの shouji.yaml のものが付く．
#   env:
#     ROS_MASTER_URI: ${ROS_MASTER_URI:-http://localhost:11311}
#   pre_command: . /opt/ros/noetic/setup.bash

tasks:
  - task.yaml
  - task_many.yaml
  - ros.yaml
  - docker-test.yaml
